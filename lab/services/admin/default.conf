server {
  listen 80;
  listen 443 ssl;
  ssl_certificate /etc/nginx/tls/cert.pem;
  ssl_certificate_key /etc/nginx/tls/key.pem;
  add_header X-Powered-By "PHP/7.4.3" always;
  location = / { return 302 /admin/login; }
  location = /admin/login {
    default_type text/html;
    add_header X-Powered-By "PHP/7.4.3" always;
    add_header Set-Cookie "PHPSESSID=labsession0001; Path=/; HttpOnly" always;
    return 200 "<html><head><title>Admin Panel - Sign in</title></head><body><form action=\"/admin/login\" method=\"post\"><input name=\"username\"><input type=\"password\" name=\"password\"></form></body></html>";
  }
}
