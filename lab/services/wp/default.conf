server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  add_header Set-Cookie "wordpress_test_cookie=WP%20Cookie%20check; Path=/" always;
  location = /wp-login.php { default_type text/html; return 200 "<html><head><title>Log In - Campus Blog - WordPress</title></head><body><form id=\"loginform\"></form></body></html>"; }
}
