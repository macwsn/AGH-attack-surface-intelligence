name: hacknation-modern

services:
  wordpress:
    image: wordpress:latest
    ports:
      - "127.0.0.1:8080:80"
    environment:
      WORDPRESS_DB_HOST: mariadb
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpresspass
      WORDPRESS_DB_NAME: wordpress
    depends_on:
      mariadb:
        condition: service_healthy

  mariadb:
    image: mariadb:11
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpresspass
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mariadb_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "127.0.0.1:8081:80"
    environment:
      PMA_HOST: mariadb

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"

  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:81:81"
      - "127.0.0.1:443:443"
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt

volumes:
  mariadb_data:
  npm_data:
  npm_letsencrypt:
