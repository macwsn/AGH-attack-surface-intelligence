name: hacknation-vulnerable

services:
  wordpress:
    image: wordpress:4.7
    ports:
      - "127.0.0.1:8088:80"
    environment:
      WORDPRESS_DB_HOST: mysql
      WORDPRESS_DB_USER: wpuser
      WORDPRESS_DB_PASSWORD: wppass
      WORDPRESS_DB_NAME: wordpress
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wpuser
      MYSQL_PASSWORD: wppass
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer
    ports:
      - "127.0.0.1:8089:8080"

  ftp:
    image: fauria/vsftpd
    ports:
      - "127.0.0.1:21:21"
      - "127.0.0.1:21000-21010:21000-21010"
    environment:
      FTP_USER: test
      FTP_PASS: test123
      PASV_ADDRESS: 127.0.0.1
      PASV_MIN_PORT: 21000
      PASV_MAX_PORT: 21010

  dvwa:
    image: vulnerables/web-dvwa
    ports:
      - "127.0.0.1:8090:80"
