# Built-in signatures for appliances and devices, written from each product's documented markers.
# Format: docs/contracts.md §4. Fixtures: internal/detect/testdata/pack/<product>/.
- id: builtin-proxmox
  name: Proxmox VE
  kind: technology
  category: virtualization
  confidence: 95
  match:
    any:
      - { type: header, name: Server, value: '^pve-api-daemon/' }
      - { type: body_regex, value: '/pve2/js/pvemanagerlib\.js' }
  version: { type: body_regex, value: 'pvemanagerlib\.js\?ver=([0-9]+(?:\.[0-9]+)+)', group: 1 }

- id: builtin-proxmox-admin
  name: Proxmox VE
  kind: admin-panel
  category: virtualization
  confidence: 90
  match:
    all:
      - { type: body_regex, value: '/pve2/js/pvemanagerlib\.js' }

- id: builtin-pfsense
  name: pfSense
  kind: technology
  category: firewall
  confidence: 90
  match:
    all:
      - { type: body_regex, value: 'id="usernamefld"' }
    any:
      - { type: title_regex, value: '^pfSense - Login$' }
      - { type: body_regex, value: 'Login to pfSense' }

- id: builtin-pfsense-admin
  name: pfSense
  kind: admin-panel
  category: firewall
  confidence: 90
  match:
    all:
      - { type: body_regex, value: 'id="usernamefld"' }
      - { type: body_regex, value: 'id="passwordfld"' }
    any:
      - { type: title_regex, value: '^pfSense - Login$' }
      - { type: body_regex, value: 'Login to pfSense' }

