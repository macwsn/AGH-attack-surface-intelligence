# Postgres for integration tests (go test -tags integration). Each test package creates its own schema.
name: asi-test
services:
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: asi, POSTGRES_PASSWORD: asi-test, POSTGRES_DB: asi }
    ports: ["127.0.0.1:55432:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U asi"], interval: 2s, timeout: 3s, retries: 30 }
