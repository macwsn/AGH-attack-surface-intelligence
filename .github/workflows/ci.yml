name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: asi, POSTGRES_PASSWORD: asi-test, POSTGRES_DB: asi }
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U asi" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: Format
        run: test -z "$(gofmt -l cmd internal)"
      - name: Vet and build
        run: go vet ./... && go build ./...
      - name: Unit tests
        run: go test ./...
      - name: Integration tests
        env:
          ASI_TEST_DATABASE_URL: postgres://asi:asi-test@127.0.0.1:55432/asi?sslmode=disable
        run: go test -tags integration -count=1 ./...
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Acceptance lab (three scans with known changes)
        run: LAB_SLOT=1 lab/run.sh
